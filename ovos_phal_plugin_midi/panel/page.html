<style>
  .mi-rows { display: grid; gap: 0.6rem; }
  .mi-row { display: grid; grid-template-columns: 9rem 1fr; gap: 0.25rem 1rem; align-items: baseline; }
  .mi-row > b { font-weight: 650; }
  .mi-small { color: var(--muted); font-size: 0.9em; overflow-wrap: break-word; }
  .mi-mono { font-family: var(--mono); font-size: 0.85em; }
  label.stack { margin-bottom: 0.8rem; }
  label.stack > span { display: block; margin-bottom: 0.3rem; }
  .mi-range { display: flex; align-items: center; gap: 0.8rem; }
  .mi-range input { flex: 1 1 auto; }
  .mi-range output { min-width: 3rem; text-align: end; font-variant-numeric: tabular-nums; }
  @media (max-width: 34rem) { .mi-row { grid-template-columns: 1fr; } }
</style>
<p class="hint" data-i18n="midi.intro">The instrument the music skills play on: the device's own synthesizer, FluidSynth with real instrument samples, or an instrument plugged into the device. Keyboards plugged in can be played along to.</p>

<section class="card">
  <h2 data-i18n="midi.now.title">Right now</h2>
  <div class="mi-rows" id="mi-now" aria-live="polite"><p data-i18n="midi.loading">Asking the MIDI plugin …</p></div>
  <div class="row">
    <button id="mi-chord" data-i18n="midi.test.chord">Play a chord</button>
    <button class="secondary" id="mi-drums" data-i18n="midi.test.drums">Play drums</button>
    <button class="secondary" id="mi-stop" data-i18n="midi.test.stop">Stop all sound</button>
  </div>
  <div class="msg" id="msg-now" role="status" aria-live="polite" hidden></div>
</section>

<section class="card">
  <h2 data-i18n="midi.settings.title">Settings</h2>
  <label class="stack"><span data-i18n="midi.synth">What plays the music</span>
    <select id="mi-synth">
      <option value="auto" data-i18n="midi.synth.auto">The best there is (automatic)</option>
      <option value="builtin" data-i18n="midi.synth.builtin">The built-in synthesizer</option>
      <option value="fluidsynth" data-i18n="midi.synth.fluidsynth">FluidSynth with a SoundFont</option>
      <option value="port" data-i18n="midi.synth.port">An instrument on a MIDI port</option>
    </select></label>
  <label class="stack" id="mi-port-wrap"><span data-i18n="midi.port">The instrument to play on</span>
    <select id="mi-port"></select></label>
  <label class="check"><input type="checkbox" id="mi-listen"> <span data-i18n="midi.listen">Listen to keyboards plugged into the device</span></label>
  <label class="check"><input type="checkbox" id="mi-thru"> <span data-i18n="midi.thru">Play what a keyboard plays on the device's own sound</span></label>
  <label class="check"><input type="checkbox" id="mi-duck"> <span data-i18n="midi.duck">Turn the music down while the assistant speaks or listens</span></label>
  <div class="mi-range"><span data-i18n="midi.duckVolume">Down to</span>
    <input type="range" id="mi-duck-volume" min="0" max="1" step="0.05" data-i18n-attr="aria-label:midi.duckVolume" aria-label="Down to">
    <output id="mi-duck-out"></output></div>
  <details>
    <summary data-i18n="midi.more">More</summary>
    <label class="stack"><span data-i18n="midi.audio">Where the sound goes</span>
      <select id="mi-audio">
        <option value="auto" data-i18n="midi.audio.auto">Automatic</option>
        <option value="sounddevice">sounddevice (PortAudio)</option>
        <option value="paplay">paplay (PulseAudio, PipeWire)</option>
        <option value="pw-cat">pw-cat (PipeWire)</option>
        <option value="aplay">aplay (ALSA)</option>
      </select></label>
    <label class="stack"><span data-i18n="midi.soundfont">SoundFont for FluidSynth (a .sf2 file; empty: the usual places)</span>
      <input type="text" id="mi-soundfont" placeholder="/usr/share/sounds/sf2/FluidR3_GM.sf2" autocomplete="off" spellcheck="false"></label>
    <label class="check"><input type="checkbox" id="mi-reverb"> <span data-i18n="midi.reverb">A little room reverb</span></label>
  </details>
  <div class="row"><button id="mi-save" data-i18n="midi.save">Save</button></div>
  <div class="msg" id="msg-save" role="status" aria-live="polite" hidden></div>
</section>
<script>
OvosWebUI.ready(function () {
  var api = OvosWebUI.api, el = OvosWebUI.el, esc = OvosWebUI.esc, t = OvosWebUI.t, say = OvosWebUI.say;
  // the English of the strings only the script shows: an English page loads
  // no strings, it reads what is in the page
  var EN = {
    "midi.plays": "Plays on",
    "midi.engine.builtin": "the built-in synthesizer",
    "midi.engine.fluidsynth": "FluidSynth",
    "midi.engine.port": "a MIDI instrument",
    "midi.engine.none": "nothing: no sound",
    "midi.sound": "Sound through",
    "midi.delay": "Delay",
    "midi.keyboards": "Keyboards",
    "midi.instruments": "Instruments",
    "midi.none": "none plugged in",
    "midi.noPorts": "MIDI ports need python-rtmidi: pip install \"ovos-phal-plugin-midi[ports]\"",
    "midi.noFluid": "FluidSynth is not installed: pip install \"ovos-phal-plugin-midi[fluidsynth]\" and a SoundFont (fluid-soundfont-gm).",
    "midi.noSoundfont": "No SoundFont found.",
    "midi.portNone": "none chosen",
    "midi.saved": "Saved. The instrument plays with the new settings.",
    "midi.restart": "Saved. Restart OVOS' PHAL service for the plugin to use it.",
    "midi.error": "The MIDI plugin could not be asked."
  };
  function tt(key) { return t(key, EN[key]); }
  var state = null;

  function row(label, value, extra) {
    return '<div class="mi-row"><b>' + esc(label) + "</b><span>" + value
      + (extra ? '<div class="mi-small">' + esc(extra) + "</div>" : "") + "</span></div>";
  }

  function show(s) {
    state = s;
    var cfg = s.settings || {}, p = s.ports || {inputs: [], outputs: [], available: false};
    var engine = tt("midi.engine." + (s.engine || "none"));
    var detail = s.engine === "fluidsynth" ? s.soundfont : (s.engine === "port" ? s.port : "");
    var cls = s.engine && s.engine !== "none" ? "ready" : "bad";
    var fluid = !s.have_fluidsynth ? tt("midi.noFluid") : (!s.found_soundfont ? tt("midi.noSoundfont") : "");
    var html = row(tt("midi.plays"), '<span class="badge ' + cls + '">' + esc(engine) + "</span>"
                   + (detail ? ' <span class="mi-mono">' + esc(detail) + "</span>" : ""),
                   [s.error || "", s.engine === "fluidsynth" ? "" : fluid].filter(Boolean).join(" "));
    if (s.output) { html += row(tt("midi.sound"), '<span class="mi-mono">' + esc(s.output) + "</span>"); }
    if (s.latency) { html += row(tt("midi.delay"), esc(Math.round(s.latency * 1000) + " ms")); }
    var listening = s.listening || [];
    html += row(tt("midi.keyboards"), esc(listening.length ? listening.join(", ") : tt("midi.none")),
                p.available ? "" : tt("midi.noPorts"));
    html += row(tt("midi.instruments"), esc(p.outputs.length ? p.outputs.join(", ") : tt("midi.none")));
    el("mi-now").innerHTML = html;
    // the form, from the settings in use
    el("mi-synth").value = cfg.synth || "auto";
    el("mi-audio").value = cfg.audio || "auto";
    el("mi-soundfont").value = cfg.soundfont || "";
    el("mi-listen").checked = (cfg.inputs || []).length > 0;
    el("mi-thru").checked = !!cfg.thru;
    el("mi-duck").checked = cfg.duck !== false;
    el("mi-duck-volume").value = cfg.duck_volume == null ? 0.3 : cfg.duck_volume;
    el("mi-reverb").checked = cfg.reverb !== false;
    var options = p.outputs.slice();
    if (cfg.output_port && options.indexOf(cfg.output_port) === -1) { options.unshift(cfg.output_port); }
    el("mi-port").innerHTML = '<option value="">' + esc(tt("midi.portNone")) + "</option>"
      + options.map(function (o) { return '<option value="' + esc(o) + '">' + esc(o) + "</option>"; }).join("");
    el("mi-port").value = cfg.output_port || "";
    sync();
  }

  function sync() {
    el("mi-duck-out").textContent = Math.round(el("mi-duck-volume").value * 100) + " %";
    el("mi-duck-volume").disabled = !el("mi-duck").checked;
    el("mi-thru").disabled = !el("mi-listen").checked;
    el("mi-port-wrap").hidden = !(state && state.ports && state.ports.outputs.length) && el("mi-synth").value !== "port";
  }
  ["mi-duck-volume", "mi-duck", "mi-listen", "mi-synth"].forEach(function (id) {
    el(id).addEventListener("input", sync); el(id).addEventListener("change", sync);
  });

  function load() {
    return api("/api/midi").then(function (s) { el("msg-now").hidden = true; show(s); })
      .catch(function (e) { el("mi-now").innerHTML = ""; say("msg-now", tt("midi.error") + " " + e.message, true); });
  }

  function post(path, body) {
    return api(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});
  }
  el("mi-chord").addEventListener("click", function () { post("/api/midi/test", {sound: "chord"}).catch(function (e) { say("msg-now", e.message, true); }); });
  el("mi-drums").addEventListener("click", function () { post("/api/midi/test", {sound: "drums"}).catch(function (e) { say("msg-now", e.message, true); }); });
  el("mi-stop").addEventListener("click", function () { post("/api/midi/stop").catch(function (e) { say("msg-now", e.message, true); }); });

  el("mi-save").addEventListener("click", function () {
    el("mi-save").disabled = true;
    post("/api/midi", {synth: el("mi-synth").value, audio: el("mi-audio").value,
                       soundfont: el("mi-soundfont").value.trim(), output_port: el("mi-port").value,
                       listen: el("mi-listen").checked, thru: el("mi-thru").checked && el("mi-listen").checked,
                       duck: el("mi-duck").checked, duck_volume: parseFloat(el("mi-duck-volume").value),
                       reverb: el("mi-reverb").checked})
      .then(function (r) {
        say("msg-save", r.restart ? tt("midi.restart") : tt("midi.saved"));
        if (!r.restart) { show(r); }
      })
      .catch(function (e) { say("msg-save", e.message, true); })
      .then(function () { el("mi-save").disabled = false; });
  });

  load();
});
</script>
